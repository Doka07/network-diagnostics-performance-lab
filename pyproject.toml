[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network-diagnostics-performance-lab"
version = "0.1.0"
description = "Repeatable TCP diagnostics and cross-layer evidence for a two-host LAN lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.1,<7", "jsonschema>=4.10.3,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]
gui = ["PySide6>=6.10,<7"]

[project.scripts]
diaglab = "diaglab.cli:main"
diaglab-gui = "diaglab.gui:main"

[tool.setuptools.packages.find]
include = ["diaglab*"]

[tool.setuptools.package-data]
diaglab = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["diaglab"]
