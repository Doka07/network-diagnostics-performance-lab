# Offline pilot example. These values are starting settings, not performance thresholds.
schema_version: "1.0"
campaign_id: c-example-001
evidence_kind: pilot
target:
  host: "10.0.0.23"
  port: 5201
  interface: enp12s0
traffic:
  tool: iperf3
  protocol: tcp
  duration_s: 30
  streams: 1
  omit_s: 0
  connect_timeout_s: 10
  finish_timeout_s: 10
  terminate_grace_s: 2
telemetry:
  collectors:
    - name: proc_net_dev
      required: true
      cadence_hz: 10
      timeout_s: 0.05
    - name: proc_net_snmp
      required: true
      cadence_hz: 10
      timeout_s: 0.05
    - name: proc_stat
      required: true
      cadence_hz: 10
      timeout_s: 0.05
    - name: process_stats
      required: true
      cadence_hz: 10
      timeout_s: 0.05
    - name: tc_qdisc
      required: true
      cadence_hz: 1
      timeout_s: 1
    - name: ethtool
      required: false
      cadence_hz: 0.2
      timeout_s: 2
safety:
  allowlist_interfaces: [enp12s0]
  allow_default_route: false
  dry_run: true
  approved_profile_id: null
scenario:
  kind: baseline
